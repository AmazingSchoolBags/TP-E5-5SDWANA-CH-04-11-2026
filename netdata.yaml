apiVersion: v1
kind: Namespace
metadata:
  name: observability-ch-04-11-2026
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdata-deployment-ch-04-11-2026
  namespace: observability-ch-04-11-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netdata-app-ch-04-11-2026
  template:
    metadata:
      labels:
        app: netdata-app-ch-04-11-2026
    spec:
      containers:
      - name: netdata
        image: netdata/netdata:latest
        ports:
        - containerPort: 19999
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: netdata-service-ch-04-11-2026
  namespace: observability-ch-04-11-2026
spec:
  type: NodePort
  selector:
    app: netdata-app-ch-04-11-2026
  ports:
  - port: 19999
    targetPort: 19999