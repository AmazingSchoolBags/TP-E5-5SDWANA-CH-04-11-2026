apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-deployment-ch-04-11-2026
  namespace: preprod-ch-04-11-2026
  labels:
    app: podinfo-app-ch-04-11-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo-app-ch-04-11-2026
  template:
    metadata:
      labels:
        app: podinfo-app-ch-04-11-2026
    spec:
      containers:
        - name: podinfo-container-ch-04-11-2026
          image: stefanprodan/podinfo:latest
          ports:
            - containerPort: 9898
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-service-ch-04-11-2026
  namespace: preprod-ch-04-11-2026
spec:
  type: NodePort
  selector:
    app: podinfo-app-ch-04-11-2026
  ports:
    - port: 9898
      targetPort: 9898
      nodePort: 30098
      