apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stripe-hpa-ch-04-11-2026
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stripe-deployment-ch-04-11-2026
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 5
      - type: Pods
        value: 4
        periodSeconds: 5
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 10
      policies:
      - type: Percent
        value: 50
        periodSeconds: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
